name: Refresh Ethiopia economic headlines and publish
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-news.yml'
      - 'scripts/**'
      - 'feeds.json'
      - 'site/**'
  schedule:
    - cron: '17 * * * *' # Hourly, UTC; GitHub can delay or skip runs.
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: ethiopia-news-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run collector unit tests
        run: python -m unittest discover -s tests -v
      - name: Collect economic headlines and optional GDELT discovery
        run: python scripts/collect.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

